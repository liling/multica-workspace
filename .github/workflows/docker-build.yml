name: Build Multica Bootstrap Image

"on":
  pull_request:
    paths:
      - Dockerfile
      - Dockerfile.bootstrap
      - compose.yaml
      - entrypoint.sh
      - healthcheck.sh
      - tests/**
      - guard-vnext/**
      - .github/workflows/docker-build.yml
  push:
    branches: [main]
    paths:
      - Dockerfile.bootstrap
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  MULTICA_VERSION: 0.13.0
  HERMES_VERSION: 0.23.4

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate split-build contract
        run: |
          bash tests/image-contract.sh
          bash tests/guard-contract.sh

  build-and-push-bootstrap:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push bootstrap image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.bootstrap
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/multica-workspace-bootstrap:${{ env.MULTICA_VERSION }}-hermes-${{ env.HERMES_VERSION }}
          build-args: |
            MULTICA_VERSION=v${{ env.MULTICA_VERSION }}
            HERMES_VERSION=v${{ env.HERMES_VERSION }}
            HERMES_IMAGE=docker.io/nousresearch/hermes-agent@sha256:ef0650d523ee1b5ab32c779acabc446d9936869a9932591553688a62bcf0c42f
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect published multi-arch image
        if: github.event_name != 'pull_request'
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/multica-workspace-bootstrap:${{ env.MULTICA_VERSION }}-hermes-${{ env.HERMES_VERSION }}
