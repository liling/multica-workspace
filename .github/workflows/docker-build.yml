name: Build Multica Bootstrap Image

"on":
  pull_request:
    paths:
      - Dockerfile
      - Dockerfile.bootstrap
      - compose.yaml
      - entrypoint.sh
      - healthcheck.sh
      - tests/**
      - .github/workflows/docker-build.yml
  push:
    branches: [main]
    paths:
      - Dockerfile.bootstrap
      - .github/workflows/docker-build.yml
  workflow_dispatch:
  schedule:
    # Keep the GitHub-only Multica layer fresh without requiring the on-prem
    # server to query GitHub. 02:17 China Standard Time.
    - cron: '17 18 * * *'

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate split-build contract
        run: bash tests/image-contract.sh

  build-and-push-bootstrap:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve latest Multica CLI release
        id: multica
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/multica-ai/multica/releases/latest --jq '.tag_name')
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid stable release tag: $tag" >&2; exit 1; }
          echo "Target Multica CLI release: $tag"
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push bootstrap image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.bootstrap
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/multica-workspace-bootstrap:latest
            ghcr.io/${{ github.repository_owner }}/multica-workspace-bootstrap:${{ steps.multica.outputs.version }}
          build-args: |
            MULTICA_VERSION=${{ steps.multica.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect published multi-arch image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/multica-workspace-bootstrap:${{ steps.multica.outputs.version }}
