name: Build Multica Bootstrap Image

"on":
  pull_request:
    paths:
      - Dockerfile
      - Dockerfile.bootstrap
      - compose.yaml
      - entrypoint.sh
      - healthcheck.sh
      - tests/**
      - .github/workflows/docker-build.yml
  push:
    branches: [main]
    paths:
      - Dockerfile.bootstrap
      - .github/workflows/docker-build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  MULTICA_VERSION: 0.7.1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate split-build contract
        run: bash tests/image-contract.sh

  build-and-push-bootstrap:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push bootstrap image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.bootstrap
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/multica-workspace-bootstrap:${{ env.MULTICA_VERSION }}
          build-args: MULTICA_VERSION=v${{ env.MULTICA_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect published multi-arch image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/multica-workspace-bootstrap:${{ env.MULTICA_VERSION }}
