name: Build Multica Bootstrap Image

"on":
  pull_request:
    paths:
      - Dockerfile
      - Dockerfile.bootstrap
      - gitnexus/**
      - compose.yaml
      - .env.example
      - entrypoint.sh
      - healthcheck.sh
      - tests/**
      - guard-vnext/**
      - .github/workflows/docker-build.yml
  push:
    branches: [main]
    paths:
      - Dockerfile.bootstrap
      - gitnexus/**
      - .github/workflows/docker-build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  MULTICA_VERSION: 0.13.0
  HERMES_VERSION: 0.23.4
  GITNEXUS_VERSION: 1.6.13-rc.260

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate split-build contract
        run: |
          bash tests/image-contract.sh
          bash tests/guard-contract.sh

  build-and-push-bootstrap:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push bootstrap image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.bootstrap
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/multica-workspace-bootstrap:${{ env.MULTICA_VERSION }}
          build-args: |
            MULTICA_VERSION=v${{ env.MULTICA_VERSION }}
            HERMES_VERSION=v${{ env.HERMES_VERSION }}
            HERMES_COMMIT=8fc0374447313e276f6b9a2764bfc750190c966a
            HERMES_ARCHIVE_SHA256=620bf64a63c7fabd995df402e46d5eee0cdab7e5d01a4aeddc3a6fa5dee54cc0
            GITNEXUS_VERSION=${{ env.GITNEXUS_VERSION }}
            PYTHON_BUILD_STANDALONE_RELEASE=20261124
            PYTHON_BUILD_STANDALONE_VERSION=3.14.10+20261124
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect published multi-arch image
        if: github.event_name != 'pull_request'
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/multica-workspace-bootstrap:${{ env.MULTICA_VERSION }}
